<!doctype html>
<html><head><meta charset="utf-8"><title>sprite sheet</title>
<style>body{margin:0;background:#3a3550}canvas{image-rendering:pixelated;display:block}</style></head>
<body>
<canvas id="c"></canvas>
<script src="../src/engine/core.js"></script>
<script src="../src/engine/gfx.js"></script>
<script src="../src/engine/font.js"></script>
<script src="../src/engine/sprites.js"></script>
<script src="../src/world/cast.js"></script>
<script>
const S = +(new URLSearchParams(location.search).get("s") || 4);
const ids = (new URLSearchParams(location.search).get('ids') || 'shawn,gus,lassiter,juliet,vick,henry,mcnab,woody,youngshawn,younghenry').split(',');
const poses = (new URLSearchParams(location.search).get('poses') || 'stand,walk0,walk2,walk4,talk,temple,point,crossed,frontIdle,back').split(',');
const cellW = 56, cellH = 100;
const W = cellW * poses.length + 70, H = cellH * ids.length;
const c = document.getElementById('c'); c.width = W; c.height = H;
c.style.width = W * S + 'px'; c.style.height = H * S + 'px';
const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
x.fillStyle = '#3a3550'; x.fillRect(0, 0, W, H);
ids.forEach((id, r) => {
  x.fillStyle = r % 2 ? '#423c5a' : '#3a3550'; x.fillRect(0, r * cellH, W, cellH);
  P.font.draw(x, id, 2, r * cellH + 4, '#fff');
  poses.forEach((pn, i) => {
    let pose;
    if (pn.startsWith('walk')) pose = P.Poses.walk(+pn.slice(4) / 8);
    else pose = P.Poses[pn](0.3);
    P.Sprite.draw(x, id, 70 + i * cellW + cellW / 2, r * cellH + cellH - 8, pose, false);
  });
});
</script>
</body></html>
