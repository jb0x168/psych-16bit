    bx = U.clamp(bx, 2, P.W - w - 2); by = Math.max(2, by);
    G.rect(x, bx, by, w, h, '#fffaf0'); G.frame(x, bx - 1, by - 1, w + 2, h + 2, '#1d1526');
    G.hl(x, bx, by + h - 1, w, '#e0d8c8');
    const tx = U.clamp(X, bx + 4, bx + w - 5);
    G.poly(x, [[tx - 3, by + h], [tx + 2, by + h], [tx - 1, by + h + 4]], '#fffaf0');
    G.line(x, tx - 3, by + h, tx - 1, by + h + 4, '#1d1526'); G.line(x, tx + 2, by + h, tx - 1, by + h + 4, '#1d1526');
    lines.forEach((l, i) => P.font.draw(x, l, bx + 4, by + 3 + i * 9, '#2a2038'));
  }
  P.drawBubble = drawBubble;

  /* ======================= Scene runtime ======================= */
  class Scene {
    constructor(def, game) {
      this.def = def; this.game = game;
      this.id = def.id;
      this.W = def.width || P.W;
      this.floor = Object.assign({ x0: 8, x1: this.W - 8, y0: 132, y1: 172 }, def.floor || {});
      this.blockers = def.blockers || [];
      this.camX = 0;
      this.actors = {};
      this.t = 0;
      this.bg = null; this.fg = null; this.variant = null;
    }
    g() { return this.game.g; }
    build() {
      const g = this.g();
      // actors defined by the scene (visibility evaluated live)
      for (const a of this.def.actors || []) {
        if (a.show && !a.show(g)) continue;
        this.addActor(Object.assign({}, a));
      }
      this.renderBg();
    }
    addActor(def) {
      const a = new Actor(def);
      if (def.guard) a.guard = Object.assign({ phase: 0, i: 0, alert: 0 }, def.guard);
      this.actors[a.id] = a;
      return a;
    }
    removeActor(id) { delete this.actors[id]; }
    renderBg() {
      const g = this.g();
      const v = this.def.variant ? this.def.variant(g) : 'default';
      if (this.bg && v === this.variant) return;
      this.variant = v;
      const before = P.props.pineappleCount;
      this.bg = G.canvas(this.W, P.H);
      if (this.def.bg) this.def.bg(this.bg.x, { W: this.W, H: P.H, v, g });
      this.paintedPineapple = P.props.pineappleCount > before;
      if (this.def.fg) { this.fg = G.canvas(this.W, P.H); this.def.fg(this.fg.x, { W: this.W, H: P.H, v, g }); } else this.fg = null;
    }
    blocked(x, y) {
      const f = this.floor;
      if (x < f.x0 || x > f.x1 || y < f.y0 || y > f.y1) return true;
      for (const b of this.blockers) {
        if (b.show && !b.show(this.g())) continue;
        if (x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h) return true;
      }
      return false;
    }
    clampToFloor(x, y) {
      const f = this.floor;
      return [U.clamp(x, f.x0, f.x1), U.clamp(y, f.y0, f.y1)];
    }
    // interactable list (actors + hotspots), screen-space aware
    interactables(vision) {
      const g = this.g();
      const list = [];
      for (const a of Object.values(this.actors)) {
        if (!a.visible || a.id === 'shawn' || a.def.noInteract) continue;
        if (a.id === 'gus' && !a.def.talk && !this.game.chapter) continue;
        const cd = a.castDef;
        const b = a.bounds();
        const sx = this.actors.shawn ? this.actors.shawn.x : 0;
        list.push({ kind: 'actor', actor: a, id: a.id, name: a.def.name || (cd ? cd.short : a.id), rect: b, walk: a.def.walk || [a.x + (a.x > sx ? -24 : 24), a.y], depth: a.y });
      }
      for (const h of this.def.hotspots || []) {
        if (h.show && !h.show(g)) continue;
        if (h.secret && !vision) continue;
        list.push({ kind: h.exit ? 'exit' : 'hotspot', hs: h, id: h.id, name: U.call(h.name, g), rect: { x: h.x, y: h.y, w: h.w, h: h.h }, walk: h.walk, depth: h.depth || (h.y + h.h) - 400 });
      }
      return list;
    }
    pick(mx, my, vision) {
      const wx = mx + this.camX;
      const list = this.interactables(vision).filter((o) => U.inRect(wx, my, o.rect));
      list.sort((a, b) => b.depth - a.depth);
      return list[0] || null;
    }
    nearest(vision) {
      const s = this.actors.shawn;
      if (!s) return null;
      let best = null, bd = 1e9;
      for (const o of this.interactables(vision)) {
        if (o.hs && (o.hs.noFocus || o.hs.walk === null)) continue; // big backdrop hotspots are mouse-only
        const r = o.rect;
        const cx = U.clamp(s.x, r.x, r.x + r.w);
        const target = o.walk || [cx, s.y];
        const dx = Math.abs(s.x - cx), dy = Math.abs(s.y - (o.kind === 'actor' ? o.actor.y : U.clamp(s.y, r.y, r.y + r.h + 40)));
        let d = dx + dy * 0.5;
        if (o.walk) d = Math.min(d, U.dist(s.x, s.y, o.walk[0], o.walk[1]));
        // must roughly face it
        const facing = (cx - s.x) * s.face >= -6;
        if (!facing) d += 30;
        if (d < 34 && d < bd) { bd = d; best = o; }
      }
      return best;
    }
    update(dt) {
      this.t += dt;
      for (const a of Object.values(this.actors)) {
        a.update(dt, this);
        const gd = a.guard;
        if (gd && !(gd.off && gd.off(this.g())) && !(gd.alert > 0)) {
          // guards turn on their own clock and telegraph each turn with a '?'
          if (gd.timer == null) { gd.i = 0; gd.timer = gd.pattern[0].t; }
          gd.timer -= dt;
          const cur = gd.pattern[gd.i % gd.pattern.length], nxt = gd.pattern[(gd.i + 1) % gd.pattern.length];
          if (!a.target) a.face = cur.face === 'left' ? -1 : 1;
          if (gd.timer < 0.8 && nxt.face !== cur.face && !gd.warned) { a.emo('?', 700); gd.warned = true; }
          if (gd.timer <= 0) { gd.i++; gd.timer = gd.pattern[gd.i % gd.pattern.length].t; gd.warned = false; if (cur.say && Math.random() < 0.5) a.say(U.pick(cur.say), 1600); }
        }
      }
      // camera follow
      const s = this.actors[this.camTarget || 'shawn'];
      if (s && this.W > P.W) {
        const tx = U.clamp(s.x - P.W / 2, 0, this.W - P.W);
        this.camX = this.camSnap ? tx : U.lerp(this.camX, tx, Math.min(1, dt * 5));
        if (Math.abs(this.camX - tx) < 0.5) this.camX = tx;
        this.camSnap = false;
      } else if (this.W <= P.W) this.camX = 0;
      if (this.def.update) this.def.update(this, dt, this.g());
    }
    draw(x, opts = {}) {
      const cam = Math.round(this.camX);
      if (this.bg) x.drawImage(this.bg, -cam, 0);
      if (this.def.anim) this.def.anim(x, this.t, { cam, W: this.W, v: this.variant, g: this.g(), scene: this });
      if (this.game.rev && P.Revelation) P.Revelation.drawAura(x, this.game, cam);
      // guard vision cones
      for (const a of Object.values(this.actors)) if (a.guard && a.visible && !a.guard.off) drawCone(x, a, cam, this.t);
      const list = Object.values(this.actors).filter((a) => a.visible).sort((p, q) => p.y - q.y);
      // depth props (foreground objects sorted with actors)
      const props = (this.def.props || []).filter((p) => !p.show || p.show(this.g()));
      let pi = 0; props.sort((a, b) => a.y - b.y);
      for (const a of list) {
        while (pi < props.length && props[pi].y <= a.y) { props[pi].draw(x, cam, this.t, this.g()); pi++; }
        a.draw(x, cam);
      }
      while (pi < props.length) { props[pi].draw(x, cam, this.t, this.g()); pi++; }
      if (this.fg) x.drawImage(this.fg, -cam, 0);
      if (this.def.overlay) this.def.overlay(x, this.t, { cam, g: this.g(), scene: this });
    }
    drawOverlays(x) {
      const cam = Math.round(this.camX);
      for (const a of Object.values(this.actors)) a.drawOverlay(x, cam, this.t);
    }
  }
  function drawCone(x, a, cam, t) {
    const gd = a.guard;
    const range = gd.range || 90;
    const sx = Math.round(a.x - cam), sy = Math.round(a.y - a.height * 0.75);
    x.save();
    x.globalAlpha = gd.alert > 0 ? 0.32 : 0.13 + Math.sin(t * 4) * 0.03;
    x.fillStyle = gd.alert > 0 ? '#ff3a4a' : '#fff2a0';
    x.beginPath(); x.moveTo(sx, sy); x.lineTo(sx + a.face * range, sy - 18); x.lineTo(sx + a.face * range, a.y + 6); x.closePath(); x.fill();
    x.restore();
  }
  P.Scene = Scene;
})(window.P);

</script>
<script>/* src/engine/ui.js */
'use strict';
/* UI widgets. Each modal widget lives on game.ui (a stack); the top one receives input.
   Widgets resolve a promise when done so scripts can `await` them. */
(function (P) {
  const G = P.G, U = P.U, C = P.C;
  const F = () => P.font;
  const I = () => P.input;
  const UI = P.UI = {};
  const ACC = '#9be564'; // psych green accent
  UI.ACC = ACC;

  /* ---------------- window skin ---------------- */
  UI.panel = (x, X, Y, W, H, o = {}) => {
    X = Math.round(X); Y = Math.round(Y);
    const fill = o.fill || ['#2b2368', '#241d58', '#1e1849', '#19143c'];
    G.rect(x, X, Y, W, H, '#0e0a14');
    G.bands(x, X + 2, Y + 2, W - 4, H - 4, fill, 0);
    G.hl(x, X + 1, Y + 1, W - 2, o.hi || '#e8e0ff'); G.vl(x, X + 1, Y + 1, H - 2, o.hi || '#e8e0ff');
    G.hl(x, X + 1, Y + H - 2, W - 2, o.lo || '#7a70b8'); G.vl(x, X + W - 2, Y + 1, H - 2, o.lo || '#7a70b8');
    G.px(x, X + 1, Y + 1, o.accent || ACC); G.px(x, X + W - 2, Y + 1, o.accent || ACC); G.px(x, X + 1, Y + H - 2, o.accent || ACC); G.px(x, X + W - 2, Y + H - 2, o.accent || ACC);
  };
  UI.tag = (x, X, Y, text, col) => {
    const w = F().width(text) + 8;
    G.rect(x, X, Y, w, 11, '#0e0a14'); G.rect(x, X + 1, Y + 1, w - 2, 9, '#171238'); G.hl(x, X + 1, Y + 1, w - 2, col);
    F().draw(x, text, X + 4, Y + 2, col);
    return w;
  };
  UI.button = (x, X, Y, W, H, label, hot, o = {}) => {
    G.rect(x, X, Y, W, H, '#0e0a14');
    G.rect(x, X + 1, Y + 1, W - 2, H - 2, hot ? '#4a3ea0' : '#241d58');
    G.hl(x, X + 1, Y + 1, W - 2, hot ? ACC : '#7a70b8');
    F().draw(x, label, X + W / 2, Y + Math.floor((H - 7) / 2), hot ? '#ffffff' : (o.dim ? '#7a70b8' : '#d8d0ff'), { align: 'center' });
  };
  UI.cursor = (x, X, Y, t) => { const o = Math.round(Math.sin(t * 10)); F().draw(x, '▶', X + o, Y, ACC); };

  const mouseIn = (X, Y, W, H) => { const i = I(); return i.mx >= X && i.my >= Y && i.mx < X + W && i.my < Y + H; };
  UI.mouseIn = mouseIn;

  /* ---------------- base ---------------- */
  class Widget {
    constructor(game) { this.game = game; this.t = 0; this.done = false; this.promise = new Promise((r) => { this._res = r; }); this.modal = true; }
    close(v) { if (this.done) return; this.done = true; this.result = v; this._res(v); }
    update(dt) { this.t += dt; }
    draw() {}
  }
  UI.Widget = Widget;

  /* ---------------- dialogue ---------------- */
  function parseWho(who) {
    if (!who) return { id: null, expr: null };
    const [id, expr] = String(who).split(':');
    return { id, expr: expr || null };
  }
  class Dialogue extends Widget {
    constructor(game, who, text, o = {}) {
      super(game);
      const w = parseWho(who);
      this.who = w.id; this.expr = o.expr || w.expr;
      this.cast = P.getCast(this.who);
      this.name = o.name || (this.cast ? this.cast.short : this.who === 'narrator' || !this.who ? null : this.who);
      this.text = text;
      this.thought = !!o.thought || this.who === 'thought';
      if (this.who === 'thought') { this.cast = P.getCast('shawn'); this.name = 'Shawn (thinking)'; }
      this.phone = !!o.phone;
      this.lines = F().wrap(text, this.cast ? 244 : 296);
      this.total = F().count(this.lines.join(' '));
      this.shown = 0;
      this.pos = o.pos || game.dialoguePos || 'top';
      const actor = game.scene && this.who && game.scene.actors[this.who];
      this.actor = actor || null;
      if (this.actor) this.actor.talking = true;
      if (this.actor && this.expr) this.actor.expr = this.expr;
      if (P.debugAuto) this.shown = this.total;
    }
    get typing() { return this.shown < this.total; }
    finish() { this.shown = this.total; }
    close(v) { if (this.actor) { this.actor.talking = false; } super.close(v); }
    update(dt) {
      super.update(dt);
      const speed = this.game.settings.textSpeed || 55;
      if (this.typing) {
        const before = Math.floor(this.shown);
        this.shown = Math.min(this.total, this.shown + dt * (I().held('skip') ? 400 : speed));
        if (Math.floor(this.shown) !== before) {
          const ch = F().strip(this.lines.join(' '))[Math.floor(this.shown) - 1];
          if (ch && ch !== ' ' && Math.floor(this.shown) % 2 === 0) P.audio.blip(this.cast ? this.cast.voice : { pitch: 1.2 });
        }
        if (!this.typing && this.actor) this.actor.talking = false;
      }
      const go = I().pressed('confirm') || I().clicked || (I().held('skip') && this.t > 0.08) || (P.debugAuto && this.t > 0.02);
      if (go && !(this.hold && !this.typing)) {
        if (this.typing) this.finish();
        else { P.audio.sfx('page'); this.close(true); }
      }
    }
    draw(x) {
      const top = this.pos === 'top';
      const bx = 4, bw = P.W - 8, bh = 52;
      const by = top ? 4 : P.H - bh - 4;
      UI.panel(x, bx, by, bw, bh, this.thought ? { fill: ['#3a2a5a', '#30224e', '#281c44', '#20163a'], accent: '#c8a0ff' } : this.phone ? { fill: ['#1e3a3a', '#1a3232', '#162a2a', '#122222'], accent: '#7ee2d0' } : {});
      let tx = bx + 8;
      if (this.cast) {
        const talking = this.typing && Math.floor(this.t * 9) % 2 === 0;
        const blink = !talking && (this.t % 3.6) > 3.45;
        const pr = P.Portrait.get(this.cast.id, this.expr || (this.cast.portrait && this.cast.portrait.base) || 'neutral', { talk: talking, blink });
        const px = bx + 5, py = top ? by + 4 : by - 8;
        G.rect(x, px - 1, py - 1, P.Portrait.W + 2, (top ? 44 : P.Portrait.H) + 2, '#0e0a14');
        if (top) { x.drawImage(pr, 0, 4, P.Portrait.W, 44, px, py, P.Portrait.W, 44); }
        else x.drawImage(pr, px, py);
        G.frame(x, px - 1, py - 1, P.Portrait.W + 2, (top ? 44 : P.Portrait.H) + 2, (this.cast.portrait && this.cast.portrait.frame) || '#c8d0ff');
        if (this.phone) { G.rect(x, px + P.Portrait.W - 9, py + 2, 7, 11, '#2a2a34'); G.rect(x, px + P.Portrait.W - 8, py + 3, 5, 7, '#6ab0ff'); }
        tx = bx + 60;
      }
      let ty = by + 6;
      if (this.name) {
        const col = this.cast ? this.cast.color : '#c8d0ff';
        F().draw(x, this.thought ? '(' + this.name + ')' : this.name.toUpperCase(), tx, ty, col);
        ty += 11;
      }
      let left = Math.floor(this.shown);
      const baseCol = this.thought ? '#d8c8ff' : '#f4f0ff';
      for (const l of this.lines) {
        const n = F().count(l);
        F().draw(x, l, tx, ty, baseCol, { count: Math.max(0, left), shadow: '#0e0a14' });
        left -= n + 1;
        ty += 10;
        if (left < 0) break;
      }
      if (!this.typing) { const o = Math.floor(this.t * 3) % 2; G.poly(x, [[bx + bw - 12, by + bh - 9 + o], [bx + bw - 6, by + bh - 9 + o], [bx + bw - 9, by + bh - 5 + o]], ACC); }
    }
  }
  UI.Dialogue = Dialogue;

  /* ---------------- choice menu ---------------- */
  class Choice extends Widget {
    constructor(game, options, o = {}) {
      super(game);
      this.opts = options.map((op) => (typeof op === 'string' ? { text: op } : op));
      this.title = o.title || null;
      this.cancel = o.cancel;
      this.sel = Math.max(0, this.opts.findIndex((op) => !op.disabled));
      this.w = Math.min(300, Math.max(120, ...this.opts.map((op) => F().width(op.text) + 26), this.title ? F().width(this.title) + 16 : 0));
      this.h = this.opts.length * 11 + 8 + (this.title ? 12 : 0);
      this.x = o.x != null ? o.x : P.W - this.w - 6;
      this.y = o.y != null ? o.y : (game.dialoguePos === 'bottom' ? P.H - 60 - this.h : 60);
      if (this.y + this.h > P.H - 2) this.y = P.H - 2 - this.h;
      this.who = o.who || null;
      if (P.debugAuto) this.autoPick = o.auto;
    }
    update(dt) {
      super.update(dt);
      if (P.debugAuto && this.t > 0.02) {
        const want = P.debugPick ? P.debugPick(this.opts, this) : null;
        const idx = want != null ? want : 0;
        this.close(this.opts[idx].value != null ? this.opts[idx].value : idx); return;
      }
      const n = this.opts.length;
      const move = (d) => { let s = this.sel; for (let k = 0; k < n; k++) { s = (s + d + n) % n; if (!this.opts[s].disabled) break; } if (s !== this.sel) { this.sel = s; P.audio.sfx('select'); } };
      if (I().pressed('up')) move(-1);
      if (I().pressed('down')) move(1);
      const y0 = this.y + 4 + (this.title ? 12 : 0);
      if (I().moved || I().clicked) {
        for (let i = 0; i < n; i++) if (mouseIn(this.x, y0 + i * 11, this.w, 11) && !this.opts[i].disabled) { if (this.sel !== i) { this.sel = i; if (!I().clicked) P.audio.sfx('select'); } }
      }
      const clickedIn = I().clicked && mouseIn(this.x, y0, this.w, n * 11);
      if (I().pressed('confirm') || clickedIn) {
        const op = this.opts[this.sel];
        if (op && !op.disabled) { P.audio.sfx('confirm'); this.close(op.value != null ? op.value : this.sel); }
      } else if (this.cancel !== undefined && (I().pressed('cancel') || I().rclicked || (I().clicked && !mouseIn(this.x, this.y, this.w, this.h)))) { P.audio.sfx('cancel'); this.close(this.cancel); }
    }
    draw(x) {
      UI.panel(x, this.x, this.y, this.w, this.h);
      let y = this.y + 4;
      if (this.title) { F().draw(x, this.title, this.x + 8, y + 1, ACC); y += 12; }
      this.opts.forEach((op, i) => {
        const hot = i === this.sel;
        if (hot) G.rect(x, this.x + 3, y - 1, this.w - 6, 10, '#3a2e86');
        if (hot) UI.cursor(x, this.x + 5, y, this.t);
        const col = op.disabled ? '#5a5288' : op.done ? '#9a92c8' : hot ? '#ffffff' : '#d8d0ff';
        if (op.icon) x.drawImage(P.icon(op.icon), 0, 0, 18, 18, this.x + this.w - 15, y - 1, 9, 9);
        F().draw(x, op.text, this.x + 14, y, col);
        if (op.done) F().draw(x, '✓'.replace('✓', '•'), this.x + this.w - 10, y, '#7a70b8');
        y += 11;
      });
    }
  }
  UI.Choice = Choice;

  /* ---------------- toast ---------------- */
  class Toast extends Widget {
    constructor(game, text, icon, col) { super(game); this.modal = false; this.text = text; this.icon = icon; this.col = col || ACC; this.dur = 2.8; }
    update(dt) { super.update(dt); if (this.t > this.dur) this.close(); }
    draw(x, idx) {
      const w = F().width(this.text) + (this.icon ? 28 : 12);
      const slide = this.t < 0.25 ? 1 - this.t / 0.25 : this.t > this.dur - 0.3 ? (this.t - (this.dur - 0.3)) / 0.3 : 0;
      const X = Math.round(P.W - w - 4 + slide * (w + 10)), Y = 22 + idx * 22;
      UI.panel(x, X, Y, w, 20, { accent: this.col });
      if (this.icon) x.drawImage(P.icon(this.icon), X + 4, Y + 1);
      F().draw(x, this.text, X + (this.icon ? 24 : 6), Y + 7, this.col);
    }
  }
  UI.Toast = Toast;

  /* ---------------- title card ---------------- */
  class TitleCard extends Widget {
    constructor(game, o) { super(game); this.o = o; this.dur = o.dur || 4.2; }
    update(dt) { super.update(dt); if ((this.t > 0.8 && (I().pressed('confirm') || I().clicked)) || this.t > this.dur || (P.debugAuto && this.t > 0.05)) this.close(); }
    draw(x) {
      const t = this.t;
      // swirling 16-bit backdrop with palette cycling
      const cols = ['#1a1240', '#24185a', '#2e1e74', '#3a2690', '#24185a'];
      for (let yy = 0; yy < P.H; yy += 2) {
        const k = Math.floor((yy / 12 + t * 6 + Math.sin(yy / 20 + t * 2) * 2)) % cols.length;
        G.rect(x, 0, yy, P.W, 2, cols[(k + cols.length) % cols.length]);
      }
      for (let i = 0; i < 18; i++) { const a = t * 0.6 + i * 0.35; G.sparkle(x, 160 + Math.cos(a * 1.3 + i) * (60 + i * 6), 90 + Math.sin(a + i) * (30 + i * 3), (i % 3) + 1, i % 2 ? '#9be564' : '#fee761'); }
      const s = Math.min(1, t / 0.5);
      UI.logo(x, 160, 40 - (1 - U.ease.outBack(s)) * 50, 1);
      if (t > 0.6) {
        const a = Math.min(1, (t - 0.6) / 0.4);
        x.save(); x.globalAlpha = a;
        if (this.o.kicker) F().draw(x, this.o.kicker, 160, 84, '#c8d0ff', { align: 'center', shadow: '#0e0a14' });
        F().draw(x, this.o.title, 160, 98, '#ffffff', { align: 'center', scale: 2, outline: '#0e0a14' });
        if (this.o.sub) F().draw(x, this.o.sub, 160, 126, ACC, { align: 'center', shadow: '#0e0a14' });
        x.restore();
      }
    }
  }
  UI.TitleCard = TitleCard;

  // the game logo: chunky letters + pineapple-free psychic swirl
  UI.logo = (x, cx, cy, scale = 1, t = 0) => {
    const txt = 'PSYCH';
    const w = F().width(txt) * 4 * scale;
    const X = Math.round(cx - w / 2), Y = Math.round(cy);
    // drop shadow + outline via repeated draws
    for (const [dx, dy, c] of [[3, 3, '#0e0a14'], [-1, 0, '#0e0a14'], [1, 0, '#0e0a14'], [0, -1, '#0e0a14'], [0, 1, '#0e0a14'], [-2, -1, '#1d4a14'], [2, 2, '#1d4a14']]) F().draw(x, txt, X + dx * scale, Y + dy * scale, c, { scale: 4 * scale });
    F().draw(x, txt, X, Y, '#9be564', { scale: 4 * scale });
    // gloss band
    x.save(); x.beginPath(); x.rect(X, Y, w, 10 * scale); x.clip(); F().draw(x, txt, X, Y, '#d4ff9c', { scale: 4 * scale }); x.restore();
    x.save(); x.beginPath(); x.rect(X, Y + 22 * scale, w, 8 * scale); x.clip(); F().draw(x, txt, X, Y, '#5aa83a', { scale: 4 * scale }); x.restore();
  };

  /* ---------------- Shawn-Vision zoom lens ---------------- */
  class Zoom extends Widget {
    constructor(game, o) {
      super(game);
      this.o = o;
      const buf = game.buf;
      const cw = 52, ch = 36;
      this.snap = G.canvas(cw, ch);
      this.snap.x.drawImage(buf, -Math.round(o.sx - cw / 2), -Math.round(o.sy - ch / 2));
      this.lines = F().wrap(o.text || '', 280);
      P.audio.sfx('zoom');
    }
    update(dt) {
      super.update(dt);
      if ((this.t > 0.6 && (I().pressed('confirm') || I().clicked)) || (P.debugAuto && this.t > 0.05)) { P.audio.sfx('page'); this.close(); }
    }
    draw(x) {
      const t = this.t, o = this.o;
      const k = U.ease.outBack(Math.min(1, t / 0.45));
      // dim + speed lines
      x.save(); x.globalAlpha = Math.min(0.65, t * 2); G.rect(x, 0, 0, P.W, P.H, '#0e0a14'); x.restore();
      const cx = U.lerp(o.sx, 160, Math.min(1, t / 0.35)), cy = U.lerp(o.sy, 66, Math.min(1, t / 0.35));
      for (let i = 0; i < 24; i++) {
        const a = (i / 24) * Math.PI * 2 + t * 0.4, r0 = 50 + ((t * 300 + i * 37) % 120);
        G.line(x, cx + Math.cos(a) * r0, cy + Math.sin(a) * r0, cx + Math.cos(a) * (r0 + 14), cy + Math.sin(a) * (r0 + 14), i % 3 ? '#5d4ca8' : '#9be564');
      }
      const R = Math.round(48 * k);
      if (R > 2) {
        x.save();
        x.beginPath(); x.arc(cx, cy, R, 0, Math.PI * 2); x.clip();
        x.drawImage(this.snap, Math.round(cx - 78), Math.round(cy - 54), 156, 108);
        if (o.icon) { const ic = P.icon(o.icon); const s = 3; x.drawImage(ic, Math.round(cx - 9 * s), Math.round(cy - 9 * s + Math.sin(t * 3) * 2), 18 * s, 18 * s); }
        x.restore();
        // lens rim
        for (let a = 0; a < 90; a++) { const ang = (a / 90) * Math.PI * 2; G.px(x, cx + Math.cos(ang) * (R + 1), cy + Math.sin(ang) * (R + 1), '#0e0a14'); G.px(x, cx + Math.cos(ang) * (R + 2), cy + Math.sin(ang) * (R + 2), a % 6 < 3 ? '#9be564' : '#fee761'); G.px(x, cx + Math.cos(ang) * (R + 3), cy + Math.sin(ang) * (R + 3), '#0e0a14'); }
        G.sparkle(x, cx - R * 0.6, cy - R * 0.6, 3, '#ffffff');
      }
      if (t > 0.35) {
        const bh = 18 + this.lines.length * 10;
        const by = P.H - bh - 4;
        UI.panel(x, 6, by, P.W - 12, bh, { accent: '#fee761' });
        F().draw(x, (o.kicker || 'SHAWN NOTICES') + ':', 14, by + 5, '#fee761');
        F().draw(x, o.title || '', 14 + F().width((o.kicker || 'SHAWN NOTICES') + ': ') + 2, by + 5, '#ffffff');
        this.lines.forEach((l, i) => F().draw(x, l, 14, by + 17 + i * 10, '#d8d0ff', { shadow: '#0e0a14' }));
      }
    }
  }
  UI.Zoom = Zoom;

  /* ---------------- generic "press a key" message panel ---------------- */
  class Message extends Widget {
    constructor(game, title, body, o = {}) { super(game); this.title = title; this.lines = F().wrap(body || '', 250); this.o = o; }
    update(dt) { super.update(dt); if ((this.t > 0.3 && (I().pressed('confirm') || I().clicked || I().pressed('cancel'))) || (P.debugAuto && this.t > 0.02)) { P.audio.sfx('confirm'); this.close(); } }
    draw(x) {
      const h = 30 + this.lines.length * 10, w = 270, X = (P.W - w) / 2, Y = (P.H - h) / 2;
      x.save(); x.globalAlpha = 0.5; G.rect(x, 0, 0, P.W, P.H, '#0e0a14'); x.restore();
      UI.panel(x, X, Y, w, h, { accent: this.o.col || ACC });
      if (this.o.icon) x.drawImage(P.icon(this.o.icon), X + 8, Y + 6);
      F().draw(x, this.title, X + (this.o.icon ? 30 : 10), Y + 9, this.o.col || ACC);
      this.lines.forEach((l, i) => F().draw(x, l, X + 10, Y + 24 + i * 10, '#f4f0ff', { shadow: '#0e0a14' }));
    }
  }
  UI.Message = Message;
})(window.P);

</script>
<script>/* src/engine/menus.js */
'use strict';
/* Case File (inventory / evidence picker), pause menu, settings. */
(function (P) {
  const G = P.G, U = P.U, UI = P.UI;
  const F = () => P.font, I = () => P.input;
  const ACC = UI.ACC;

  const TABS = {
    clues: { label: 'CLUES', empty: 'No clues yet. Talk to people. Look at things. Use your "gift" (Q).' },
    items: { label: 'ITEMS', empty: 'Your pockets contain lint and a pineapple-scented air freshener. Nothing useful.' },
    gifts: { label: 'FOR JULES', empty: 'Nothing for Juliet yet. Hidden things show up in Shawn-Vision...' },
    snacks: { label: 'SNACKS', empty: 'Gus: "We have not eaten in this chapter, Shawn." Unacceptable.' },
    notes: { label: 'NOTES' },
  };

  class CaseFile extends UI.Widget {
    constructor(game, o = {}) {
      super(game);
      this.o = o;
      this.pick = !!o.pick;
      this.tabs = o.kinds || ['clues', 'items', 'gifts', 'snacks', 'notes'];
      this.tab = 0; this.sel = 0; this.scroll = 0;
      this.lastTab = -1;
      P.audio.sfx('page');
      if (P.debugAuto && this.pick) this.autoT = 0;
    }
    entries(kind) {
      const g = this.game, s = g.state, ch = g.chapter;
      if (!s || !ch) return [];
      const defs = kind === 'clues' ? ch.clues : kind === 'items' ? ch.items : kind === 'gifts' ? ch.gifts : kind === 'snacks' ? ch.snacks : {};
      const ids = kind === 'clues' ? s.clues : kind === 'items' ? s.items : kind === 'gifts' ? s.gifts : kind === 'snacks' ? s.snacks : [];
      return ids.map((id) => Object.assign({ id, kind }, defs[id] || P.world.items[id] || { name: id, icon: 'question', desc: '' }));
    }
    update(dt) {
      super.update(dt);
      const kind = this.tabs[this.tab];
      const list = this.entries(kind);
      if (P.debugAuto && this.pick) {
        const want = P.debugPresent ? P.debugPresent(this) : null;
        this.close(want); return;
      }
      if (this.tab !== this.lastTab) { this.sel = 0; this.scroll = 0; this.lastTab = this.tab; }
      const cols = 6;
      const go = (d) => { const n = list.length; if (!n) return; this.sel = U.clamp(this.sel + d, 0, n - 1); P.audio.sfx('select'); };
      if (I().pressed('left')) go(-1);
      if (I().pressed('right')) go(1);
      if (I().pressed('up')) go(-cols);
      if (I().pressed('down')) go(cols);
      if (I().pressed('casefile') && !this.pick) { this.close(null); P.audio.sfx('cancel'); return; }
      if (I().pressed('cancel') || I().rclicked) { P.audio.sfx('cancel'); this.close(null); return; }
      // tab switching: Q/E? use [ ] or mouse; keyboard: shift tabs with 'vision'(Q) and 'phone'(H) is weird -> use PageUp/PageDown + number keys
      for (let i = 0; i < this.tabs.length; i++) if (I().pressed('Digit' + (i + 1))) { this.tab = i; P.audio.sfx('page'); }
      if (I().pressed('BracketLeft') || I().pressed('PageUp')) { this.tab = (this.tab - 1 + this.tabs.length) % this.tabs.length; P.audio.sfx('page'); }
      if (I().pressed('BracketRight') || I().pressed('PageDown')) { this.tab = (this.tab + 1) % this.tabs.length; P.audio.sfx('page'); }
      // mouse
      const X = 8, Y = 6;
      if (I().clicked || I().moved) {
        // tabs
        let tx = X + 8;
        for (let i = 0; i < this.tabs.length; i++) {
          const w = F().width(TABS[this.tabs[i]].label) + 10;
          if (I().clicked && UI.mouseIn(tx, Y + 6, w, 12)) { this.tab = i; P.audio.sfx('page'); }
          tx += w + 2;
        }
        // grid
        for (let i = 0; i < Math.min(24, list.length - this.scroll * cols); i++) {
          const gx = X + 10 + (i % cols) * 21, gy = Y + 26 + Math.floor(i / cols) * 21;
          if (UI.mouseIn(gx, gy, 20, 20)) {
            if (this.sel !== i + this.scroll * cols) { this.sel = i + this.scroll * cols; if (!I().clicked) P.audio.sfx('select'); }
            if (I().clicked && this.pick && this.dbl === this.sel && this.t - this.dblT < 0.45) { this.present(list); return; }
            if (I().clicked) { this.dbl = this.sel; this.dblT = this.t; }
          }
        }
        // buttons
        if (I().clicked) {
          if (this.pick && UI.mouseIn(196, 150, 50, 14)) { this.present(list); return; }
          if (UI.mouseIn(this.pick ? 250 : 256, 150, 50, 14)) { P.audio.sfx('cancel'); this.close(null); return; }
        }
      }
      this.scroll = Math.max(0, Math.floor(this.sel / cols) - 3);
      if (this.pick && I().pressed('confirm')) this.present(list);
    }
    present(list) {
      const e = list[this.sel];
      if (!e) { P.audio.sfx('wrong'); return; }
      P.audio.sfx('confirm');
      this.close(e.id);
    }
    draw(x) {
      const X = 8, Y = 6, W = P.W - 16, H = P.H - 12;
      x.save(); x.globalAlpha = 0.55; G.rect(x, 0, 0, P.W, P.H, '#0e0a14'); x.restore();
      UI.panel(x, X, Y, W, H, { fill: ['#2a2a1e', '#25251a', '#202016', '#1a1a12'], hi: '#f4e8b8', lo: '#8a7a4a', accent: '#feae34' });
      // manila folder look
      G.rect(x, X + 4, Y + 20, W - 8, H - 24, '#e8d49a'); G.rect(x, X + 5, Y + 21, W - 10, H - 26, '#f4e2aa');
      G.hl(x, X + 5, Y + 21, W - 10, '#fff4c8');
      let tx = X + 8;
      for (let i = 0; i < this.tabs.length; i++) {
        const lab = TABS[this.tabs[i]].label;
        const w = F().width(lab) + 10, on = i === this.tab;
        G.rect(x, tx, Y + 6 + (on ? 0 : 2), w, on ? 15 : 12, on ? '#f4e2aa' : '#c8b47a');
        G.frame(x, tx, Y + 6 + (on ? 0 : 2), w, on ? 15 : 12, '#6a5a2a');
        if (on) G.hl(x, tx + 1, Y + 20, w - 2, '#f4e2aa');
        F().draw(x, lab, tx + 5, Y + 9 + (on ? 0 : 1), on ? '#3a2a10' : '#5a4a20');
        tx += w + 2;
      }
      if (this.o.prompt) F().draw(x, this.o.prompt, X + W - 8, Y + 9, '#feae34', { align: 'right', shadow: '#0e0a14' });
      else F().draw(x, 'CASE FILE', X + W - 8, Y + 9, '#feae34', { align: 'right' });
      const kind = this.tabs[this.tab];
      if (kind === 'notes') { this.drawNotes(x, X + 12, Y + 28); this.drawButtons(x); return; }
      const list = this.entries(kind);
      const cols = 6;
      if (!list.length) {
        const lines = F().wrap(TABS[kind].empty, 250);
        lines.forEach((l, i) => F().draw(x, l, X + 14, Y + 34 + i * 10, '#6a5a2a'));
      }
      for (let i = 0; i < 24; i++) {
        const idx = i + this.scroll * cols;
        const gx = X + 10 + (i % cols) * 21, gy = Y + 26 + Math.floor(i / cols) * 21;
        G.rect(x, gx, gy, 20, 20, '#e0cc90'); G.frame(x, gx, gy, 20, 20, '#c8b47a');
        const e = list[idx];
        if (!e) continue;
        x.drawImage(P.icon(e.icon || 'note'), gx + 1, gy + 1);
        if (idx === this.sel) { const p = Math.floor(this.t * 4) % 2; G.frame(x, gx - 1 - p, gy - 1 - p, 22 + 2 * p, 22 + 2 * p, '#c83a3a'); }
        if (e.isNew) G.px(x, gx + 17, gy + 2, '#e43b44');
      }
      // details
      const e = list[this.sel];
      const dx = X + 140, dy = Y + 26, dw = W - 150;
      G.rect(x, dx, dy, dw, 116, '#fff6d0'); G.frame(x, dx, dy, dw, 116, '#c8b47a');
      for (let ly = dy + 14; ly < dy + 114; ly += 10) G.hl(x, dx + 2, ly + 8, dw - 4, '#e8d8b0');
      if (e) {
        const big = P.icon(e.icon || 'note');
        x.drawImage(big, dx + 4, dy + 4, 36, 36);
        const nameLines = F().wrap(e.name, dw - 48);
        nameLines.forEach((l, i) => F().draw(x, l, dx + 44, dy + 6 + i * 10, '#7a2a1a'));
        if (e.kind === 'clues') F().draw(x, e.from ? 'via ' + e.from : 'evidence', dx + 44, dy + 8 + nameLines.length * 10, '#9a8a6a');
        const lines = F().wrap(e.desc || '', dw - 10);
        lines.slice(0, 7).forEach((l, i) => F().draw(x, l, dx + 5, dy + 44 + i * 10, '#3a2a10'));
      }
      this.drawButtons(x);
    }
    drawButtons(x) {
      if (this.pick) { UI.button(x, 196, 150, 50, 14, 'PRESENT', true); UI.button(x, 250, 150, 50, 14, 'CANCEL', false); }
      else UI.button(x, 256, 150, 50, 14, 'CLOSE', false);
      F().draw(x, this.pick ? 'ENTER present   ESC cancel   [ ] tabs' : 'arrows select   [ ] or 1-5 tabs   ESC close', 18, 154, '#6a5a2a');
    }
    drawNotes(x, X, Y) {
      const g = this.game, s = g.state, ch = g.chapter, gl = g.global;
      const L = (t, y, c = '#3a2a10') => F().draw(x, t, X, Y + y, c);
      L(`CHAPTER ${ch.number}: ${ch.title}`, 0, '#7a2a1a');
      L('Current lead:', 14, '#9a8a6a');
      F().wrap(s.objective || '—', 270).forEach((l, i) => L(l, 24 + i * 10));
      L('Juliet:', 54, '#9a8a6a');
      const maxH = 10, r = Math.min(maxH, gl.romance || 0);
      for (let i = 0; i < maxH; i++) G.heart(x, X + 40 + i * 9, Y + 54, i < r ? '#ff4a7a' : '#c8b47a', i < r ? '#ffd0dc' : '#d8c890');
      L(romanceLabel(gl.romance || 0), 64, '#b04060');
      L('Lassie\'s skepticism:', 80, '#9a8a6a');
      for (let i = 0; i < 3; i++) G.rect(x, X + 104 + i * 9, Y + 80, 7, 7, i < (s.skepticism || 0) ? '#e43b44' : '#c8b47a');
      L(`Clues: ${s.clues.length}   Snacks this case: ${s.snacks.length}   Lifetime snacks: ${gl.snacks || 0}`, 94);
      L(`Calls to Dad: ${s.hintsUsed || 0}`, 104);
    }
  }
  function romanceLabel(r) {
    if (r <= 0) return 'She thinks you are "a lot".';
    if (r <= 2) return 'She laughed at one of your jokes. Once.';
    if (r <= 4) return 'Definitely a smile. Gus saw it too.';
    if (r <= 6) return 'She saved your number as "Shawn" (no eye-roll emoji).';
    if (r <= 8) return 'Lassiter has noticed. He is not pleased.';
    return 'Shules is canon. Gus, start writing the toast.';
  }
  UI.CaseFile = CaseFile;

  /* ---------------- settings + pause ---------------- */
  class Settings extends UI.Widget {
    constructor(game) { super(game); this.sel = 0; }
    rows() {
      const s = P.audio.settings, gs = this.game.settings;
      const speeds = [[30, 'Slow'], [55, 'Normal'], [95, 'Fast'], [999, 'Instant']];
      const sp = speeds.find((v) => v[0] === gs.textSpeed) || speeds[1];
      return [
        { label: 'Music', val: Math.round(s.music * 10), adj: (d) => { s.music = U.clamp(Math.round(s.music * 10 + d) / 10, 0, 1); P.audio.applyVolume(); } },
        { label: 'Sound FX', val: Math.round(s.sfx * 10), adj: (d) => { s.sfx = U.clamp(Math.round(s.sfx * 10 + d) / 10, 0, 1); P.audio.applyVolume(); P.audio.sfx('select'); } },
        { label: 'Mute all', val: s.muted ? 'ON' : 'OFF', adj: () => P.audio.toggleMute() },
        { label: 'Text speed', val: sp[1], adj: (d) => { const i = U.clamp(speeds.indexOf(sp) + d, 0, 3); gs.textSpeed = speeds[i][0]; this.game.saveSettings(); } },
        { label: 'Dialogue box', val: this.game.dialoguePos === 'top' ? 'Top' : 'Bottom', adj: () => { this.game.dialoguePos = this.game.dialoguePos === 'top' ? 'bottom' : 'top'; gs.dialoguePos = this.game.dialoguePos; this.game.saveSettings(); } },
        { label: 'Fullscreen', val: document.fullscreenElement ? 'ON' : 'OFF', adj: () => this.game.toggleFullscreen() },
        { label: 'Back', back: true },
      ];
    }
    update(dt) {
      super.update(dt);
      const rows = this.rows();
      if (I().pressed('up')) { this.sel = (this.sel - 1 + rows.length) % rows.length; P.audio.sfx('select'); }
      if (I().pressed('down')) { this.sel = (this.sel + 1) % rows.length; P.audio.sfx('select'); }
      const r = rows[this.sel];
      if (I().pressed('left') && r.adj) r.adj(-1);
      if (I().pressed('right') && r.adj) r.adj(1);
      const X = 70, Y = 34;
      if (I().clicked) {
        rows.forEach((row, i) => {
          if (UI.mouseIn(X, Y + 16 + i * 13, 180, 12)) {
            this.sel = i;
            if (row.back) { this.close(); return; }
            const mid = X + 150;
            if (row.adj) row.adj(I().mx < mid ? -1 : 1);
          }
        });
      }
      if (I().pressed('confirm') && r.back) { P.audio.sfx('cancel'); this.close(); }
      else if (I().pressed('confirm') && r.adj) r.adj(1);
      if (I().pressed('cancel') || I().rclicked) { P.audio.sfx('cancel'); this.close(); }
    }
    draw(x) {
      const X = 70, Y = 34, W = 180, rows = this.rows();
      x.save(); x.globalAlpha = 0.6; G.rect(x, 0, 0, P.W, P.H, '#0e0a14'); x.restore();
      UI.panel(x, X, Y, W, 22 + rows.length * 13);
      F().draw(x, 'SETTINGS', X + W / 2, Y + 5, ACC, { align: 'center' });
      rows.forEach((r, i) => {
        const y = Y + 18 + i * 13, hot = i === this.sel;
        if (hot) { G.rect(x, X + 4, y - 2, W - 8, 11, '#3a2e86'); UI.cursor(x, X + 7, y, this.t); }
        F().draw(x, r.label, X + 16, y, hot ? '#fff' : '#d8d0ff');
        if (r.val != null) {
          if (typeof r.val === 'number') { for (let k = 0; k < 10; k++) G.rect(x, X + 100 + k * 6, y + 1, 4, 6, k < r.val ? ACC : '#3a3270'); }
          else F().draw(x, '< ' + r.val + ' >', X + W - 12, y, hot ? '#fee761' : '#a8a0d8', { align: 'right' });
        }
      });
    }
  }
  UI.Settings = Settings;

  class Pause extends UI.Widget {
    constructor(game) { super(game); this.sel = 0; P.audio.sfx('confirm'); }
    items() {
      const g = this.game;
      return [
        { label: 'Resume', act: () => this.close() },
        { label: 'Case File', act: () => { this.close(); g.openCaseFile(); } },
        { label: 'Call Dad (hint)', act: () => { this.close(); g.phoneHenry(); }, disabled: !g.chapter },
        { label: 'Settings', act: () => g.push(new Settings(g)) },
        { label: 'How to play', act: () => g.push(new Help(g)) },
        { label: 'Save & quit to title', act: () => { this.close(); g.save(); g.toTitle(); } },
      ];
    }
    update(dt) {
      super.update(dt);
      const it = this.items();
      if (I().pressed('up')) { this.sel = (this.sel - 1 + it.length) % it.length; P.audio.sfx('select'); }
      if (I().pressed('down')) { this.sel = (this.sel + 1) % it.length; P.audio.sfx('select'); }
      const X = 96, Y = 40, W = 128;
      if (I().moved || I().clicked) it.forEach((row, i) => { if (UI.mouseIn(X, Y + 18 + i * 13, W, 12)) { this.sel = i; if (I().clicked && !row.disabled) { P.audio.sfx('confirm'); row.act(); } } });
      if (I().pressed('confirm') && !it[this.sel].disabled) { P.audio.sfx('confirm'); it[this.sel].act(); }
      if (I().pressed('cancel') || I().rclicked) { P.audio.sfx('cancel'); this.close(); }
    }
    draw(x) {
      const X = 96, Y = 40, W = 128, it = this.items();
      x.save(); x.globalAlpha = 0.6; G.rect(x, 0, 0, P.W, P.H, '#0e0a14'); x.restore();
      UI.panel(x, X, Y, W, 24 + it.length * 13);
      F().draw(x, 'PAUSED', X + W / 2, Y + 6, ACC, { align: 'center' });
      it.forEach((r, i) => {
        const y = Y + 20 + i * 13, hot = i === this.sel;
        if (hot) { G.rect(x, X + 4, y - 2, W - 8, 11, '#3a2e86'); UI.cursor(x, X + 7, y, this.t); }
        F().draw(x, r.label, X + 16, y, r.disabled ? '#5a5288' : hot ? '#fff' : '#d8d0ff');
      });
    }
  }
  UI.Pause = Pause;

  class Help extends UI.Widget {
    update(dt) { super.update(dt); if (this.t > 0.2 && (I().pressed('confirm') || I().pressed('cancel') || I().clicked)) { P.audio.sfx('cancel'); this.close(); } }
    draw(x) {
      x.save(); x.globalAlpha = 0.7; G.rect(x, 0, 0, P.W, P.H, '#0e0a14'); x.restore();
      UI.panel(x, 14, 10, P.W - 28, P.H - 20);
      F().draw(x, 'HOW TO BE A FAKE PSYCHIC', P.W / 2, 17, ACC, { align: 'center' });
      const rows = [
        ['Walk', 'Arrow keys / WASD, or click the ground'],
        ['Interact', 'E / Enter / Space, or click (talk, use, enter)'],
        ['Shawn-Vision', 'Q toggles it. Hidden details sparkle. Right-click observes'],
        ['Case File', 'Tab / C - clues, items, gifts for Juliet, snacks'],
        ['Call Dad', 'H - Henry grumbles, then gives you a hint'],
        ['Skip text', 'Hold Shift'],
        ['Menu', 'Esc - settings, save & quit'],
        ['', ''],
        ['Revelations', 'When you have the right clues, tell the police'],
        ['', 'you are "having a vision". Present the evidence'],
        ['', 'that proves each point. Wrong picks raise'],
        ['', 'Lassiter\'s skepticism. Three strikes: try again later.'],
      ];
      rows.forEach(([a, b], i) => { F().draw(x, a, 24, 32 + i * 10, '#fee761'); F().draw(x, b, 92, 32 + i * 10, '#e8e0ff'); });
    }
  }
  UI.Help = Help;
})(window.P);

<script>/* src/engine/script.js */
'use strict';
/* The chapter scripting API. Every chapter script receives `g`:
     await g.say('shawn:smug', 'Text');      await g.walk('gus', 120, 150);
     if (await g.ask('lassiter', 'Well?', ['Yes', 'No']) === 0) ...
   See docs/CHAPTER_GUIDE.md for the full reference. */
(function (P) {
  const U = P.U, UI = P.UI;

  class Script {
    constructor(game) { this.game = game; }
    get s() { return this.game.state; }
    get scene() { return this.game.scene; }
    get chapter() { return this.game.chapter; }
    get global() { return this.game.global; }

    /* ---------- state ---------- */
    flag(n) { return !!(this.s && this.s.flags[n]); }
    get(n) { return this.s ? this.s.flags[n] : undefined; }
    set(n, v = true) { this.s.flags[n] = v; }
    unset(n) { delete this.s.flags[n]; }
    inc(n, d = 1) { this.s.flags[n] = (this.s.flags[n] || 0) + d; return this.s.flags[n]; }
    once(n) { if (this.flag(n)) return false; this.set(n); return true; }
    hasClue(id) { return this.s.clues.includes(id); }
    hasItem(id) { return this.s.items.includes(id); }
    hasGift(id) { return this.s.gifts.includes(id); }
    has(id) { return this.hasClue(id) || this.hasItem(id) || this.hasGift(id); }
    hasAll(ids) { return ids.every((i) => this.has(i)); }
    count(kind) { return (this.s[kind] || []).length; }
    get here() { return this.scene ? this.scene.id : null; }
    talked(npc, topic) { return !!this.s.talked[npc + ':' + topic]; }
    met(npc) { return !!this.s.met[npc]; }

    /* ---------- dialogue ---------- */
    async say(who, text, o = {}) {
      if (Array.isArray(text)) { for (const t of text) await this.say(who, t, o); return; }
      await this.game.push(new UI.Dialogue(this.game, who, text, o)).promise;
    }
    async lines(list) { for (const l of list) { if (typeof l === 'function') await l(this); else await this.say(l[0], l[1], l[2] || {}); } }
    think(text) { return this.say('thought', text, { thought: true }); }
    narrate(text) { return this.say('narrator', text); }
    async choose(options, o = {}) { return this.game.push(new UI.Choice(this.game, options, o)).promise; }
    async ask(who, text, options, o = {}) {
      // show the question; it stays on screen (held) beneath the menu
      const d = new UI.Dialogue(this.game, who, text, o);
      d.hold = true;
      this.game.push(d);
      while (d.typing && !d.done) await this.wait(16);
      const r = await this.choose(options, o);
      d.close(true);
      return r;
    }
    /* Topic menu loop for NPC conversations.
       list: [{id, label, when?, once?, run: async g => {}, done?: bool}] ; returns when the player leaves. */
    async topics(npc, list, o = {}) {
      const key = (t) => npc + ':' + t.id;
      for (;;) {
        const avail = list.filter((t) => !t.when || t.when(this)).filter((t) => !(t.once && this.s.talked[key(t)]) || t.keep);
        const opts = avail.map((t) => ({ text: U.call(t.label, this), value: t.id, done: !!this.s.talked[key(t)] && !t.fresh }));
        if (o.present !== false && (this.s.clues.length || this.s.items.length)) opts.push({ text: o.presentLabel || 'Show evidence...', value: '__present' });
        if (o.give !== false && this.s.gifts.length && npc === 'juliet') opts.push({ text: 'Give something...', value: '__gift' });
        opts.push({ text: o.byeLabel || 'Goodbye', value: '__bye' });
        const c = P.getCast(npc);
        const pick = await this.choose(opts, { title: o.title || (c ? c.short : npc), cancel: '__bye', auto: 'topic' });
        if (pick === '__bye') { if (o.bye) await o.bye(this); return; }
        if (pick === '__present') { await this.presentTo(npc, o.onPresent); continue; }
        if (pick === '__gift') { await this.giveGift(); continue; }
        const t = avail.find((x) => x.id === pick);
        if (!t) continue;
        const first = !this.s.talked[key(t)];
        this.s.talked[key(t)] = true;
        const r = await t.run(this, first);
        if (r === 'exit' || o.single) return;
      }
    }
    async presentTo(npc, handler) {
      const id = await this.pick(['clues', 'items'], 'Show to ' + (P.getCast(npc) ? P.getCast(npc).short : npc) + '?');
      if (!id) return;
      const def = this.chapter.clues[id] || this.chapter.items[id] || {};
      let handled = false;
      if (handler) handled = await handler(this, id);
      if (!handled) {
        const h = this.chapter.reactions && this.chapter.reactions[npc];
        if (h && h[id]) { await h[id](this); handled = true; }
      }
      if (!handled) {
        const generic = [
          [npc, 'I have no idea why you are showing me that.'],
          [npc, 'Is that... supposed to mean something to me?'],
          [npc, "Mm-hm. That's a " + (def.name || 'thing') + '. Good for you.'],
        ];
        await this.say(...U.pick(generic));
        await this.say('gus', U.pick(['Shawn, put that away.', 'Smooth, Shawn. Real smooth.', 'Maybe show that to someone it matters to.']));
      }
    }
    async giveGift() {
      const id = await this.pick(['gifts'], 'Give to Juliet?');
      if (!id) return;
      const def = this.chapter.gifts[id];
      this.s.gifts = this.s.gifts.filter((x) => x !== id);
      this.global.giftsGiven = (this.global.giftsGiven || []).concat(id);
      if (def && def.give) await def.give(this);
      else await this.say('juliet:happy', "For me? Shawn, that's... actually really sweet.");
      await this.romance(def && def.romance != null ? def.romance : 1);
    }

    /* ---------- evidence / inventory ---------- */
    async clue(id, o = {}) {
      if (this.hasClue(id)) return false;
      const def = this.chapter.clues[id];
      if (!def) console.warn('unknown clue', id);
      this.s.clues.push(id);
      if (o.zoom || (def && def.zoom && o.zoom !== false)) await this.zoom(Object.assign({ icon: def && def.icon, title: def && def.name, text: def && (def.notice || def.desc) }, o.zoom === true ? {} : o.zoom || {}, typeof def.zoom === 'object' ? def.zoom : {}));
      P.audio.sfx('clue');
      this.game.toast('Clue: ' + (def ? def.name : id), def && def.icon, '#fee761');
      this.game.autosave();
      return true;
    }
    async item(id, o = {}) {
      if (this.hasItem(id)) return false;
      this.s.items.push(id);
      const def = this.chapter.items[id] || P.world.items[id];
      P.audio.sfx('item');
      this.game.toast('Got: ' + (def ? def.name : id), def && def.icon, '#7ee2d0');
      return true;
    }
    take(id) { this.s.items = this.s.items.filter((x) => x !== id); }
    async gift(id) {
      if (this.hasGift(id) || (this.global.giftsGiven || []).includes(id)) return false;
      this.s.gifts.push(id);
      const def = this.chapter.gifts[id];
      P.audio.sfx('heart');
      this.game.toast('For Jules: ' + (def ? def.name : id), def && def.icon, '#ff8ab8');
      return true;
    }
    async snack(id, o = {}) {
      const def = this.chapter.snacks[id] || P.world.snacks[id] || { name: id, icon: 'taco' };
      const sh = this.scene && this.scene.actors.shawn, gu = this.scene && this.scene.actors.gus;
      if (sh) sh.setAnim('eat', 1400); if (gu && o.both !== false) gu.setAnim('eat', 1400);
      P.audio.sfx('munch');
      await this.wait(700);
      if (!this.s.snacks.includes(id)) {
        this.s.snacks.push(id);
        this.global.snacks = (this.global.snacks || 0) + 1;
        this.game.toast('Snack logged: ' + def.name, def.icon, '#feae34');
      }
      await this.wait(500);
      if (def.after) await def.after(this);
    }
    async pick(kinds, prompt) { return this.game.push(new UI.CaseFile(this.game, { pick: true, kinds, prompt })).promise; }
    objective(text) {
      if (this.s.objective === text) return;
      this.s.objective = text;
      this.game.showObjective();
    }
    async romance(n = 1) {
      this.global.romance = Math.max(0, (this.global.romance || 0) + n);
      this.s.romanceGained = (this.s.romanceGained || 0) + n;
      if (n > 0) { P.audio.sfx('heart'); this.game.toast('Juliet +' + n + ' ♥', 'heart', '#ff8ab8'); const j = this.scene && this.scene.actors.juliet; if (j) j.emo('heart', 1600); }
      this.game.saveGlobal();
    }

    /* ---------- actors ---------- */
    actor(id) { return this.scene && this.scene.actors[id]; }
    async walk(id, x, y, o = {}) {
      const a = this.actor(id);
      if (!a) return;
      a.scripted = true;
      const f = this.scene.floor;
      if (o.ghost || x < f.x0 || x > f.x1 || (y != null && (y < f.y0 || y > f.y1))) a.ghost = true;
      await a.walkTo(x, y == null ? a.y : y, o);
      a.ghost = false;
      if (!o.keepScripted) a.scripted = false;
      if (o.face) this.face(id, o.face);
    }
    walkNoWait(id, x, y, o = {}) { const a = this.actor(id); if (a) { a.scripted = true; const f = this.scene.floor; if (x < f.x0 || x > f.x1) a.ghost = true; a.walkTo(x, y == null ? a.y : y, o).then(() => { a.scripted = false; a.ghost = false; }); } }
    async approach(id, targetId, gap = 26) {
      const a = this.actor(id), t = this.actor(targetId);
      if (!a || !t) return;
      const side = a.x < t.x ? -1 : 1;
      const [x, y] = this.scene.clampToFloor(t.x + side * gap, t.y + (id === 'gus' ? -3 : 0));
      await this.walk(id, x, y);
      this.face(id, targetId);
    }
    face(id, dir) {
      const a = this.actor(id); if (!a) return;
      if (dir === 'left') a.face = -1; else if (dir === 'right') a.face = 1;
      else if (typeof dir === 'number') a.face = dir < a.x ? -1 : 1;
      else { const t = this.actor(dir); if (t) a.face = t.x < a.x ? -1 : 1; }
    }
    faceEach(a, b) { this.face(a, b); this.face(b, a); }
    anim(id, pose, ms) { const a = this.actor(id); if (a) a.setAnim(pose, ms); }
    stopAnim(id) { const a = this.actor(id); if (a) { a.anim = null; a.animUntil = 0; } }
    expr(id, e) { const a = this.actor(id); if (a) a.expr = e; }
    bubble(id, text, ms) { const a = this.actor(id); if (a) a.say(text, ms); }
    emote(id, kind, ms) { const a = this.actor(id); if (a) a.emo(kind, ms); }
    spawn(id, def) {
      if (!this.scene) return null;
      const d = Object.assign({ id, cast: id }, def);
      return this.scene.addActor(d);
    }
    remove(id) { if (this.scene) this.scene.removeActor(id); }
    // re-create an actor from the scene definition (restores talk handlers) at its current spot
    respawn(id) {
      const sc = this.scene; if (!sc) return;
      const cur = sc.actors[id];
      const d = (sc.def.actors || []).find((a) => a.id === id);
      if (!d) return;
      sc.removeActor(id);
      const a = sc.addActor(Object.assign({}, d, cur ? { x: cur.x, y: cur.y, face: cur.face < 0 ? 'left' : 'right' } : {}));
      return a;
    }
    show(id, v = true) { const a = this.actor(id); if (a) a.visible = v; }
    place(id, x, y, face) { const a = this.actor(id); if (!a) return; a.stop(); a.x = x; if (y != null) a.y = y; if (face) this.face(id, face); }
    async hop(id, h = 8) {
      const a = this.actor(id); if (!a) return;
      for (let t = 0; t <= 1; t += 0.08) { a.offY = -Math.sin(t * Math.PI) * h; await this.wait(16); }
      a.offY = 0;
    }
    async stage(map) {
      // teleport actors into formation behind a quick fade
      await this.fade(true, 250);
      for (const [id, v] of Object.entries(map)) {
        let a = this.actor(id);
        if (!a && v.spawn !== false) a = this.spawn(id, { x: v[0], y: v[1] });
        if (a) { a.stop(); a.visible = true; a.x = v[0]; a.y = v[1]; if (v[2]) this.face(id, v[2]); }
      }
      if (this.scene) this.scene.camSnap = true;
      await this.fade(false, 250);
    }
    follow(id, leader) { const a = this.actor(id); if (a) a.follow = leader; }

    /* ---------- fx / flow ---------- */
    wait(ms) { return this.game.wait(ms); }
    fade(out, ms = 400, col) { return this.game.fadeTo(out ? 1 : 0, ms, col); }
    flash(col = '#ffffff', ms = 200) { this.game.flash = { col, t: 0, dur: ms / 1000 }; }
    shake(ms = 300, mag = 3) { this.game.shakeT = ms / 1000; this.game.shakeMag = mag; }
    sfx(n) { P.audio.sfx(n); }
    music(n) { P.audio.music(n); }
    async zoom(o) {
      // o.at: hotspot id | actor id | [x,y] (world)
      let sx = 160, sy = 90;
      const sc = this.scene;
      if (sc) {
        const cam = sc.camX;
        if (Array.isArray(o.at)) { sx = o.at[0] - cam; sy = o.at[1]; }
        else if (o.at && sc.actors[o.at]) { const a = sc.actors[o.at]; sx = a.x - cam; sy = a.y - a.height * 0.6; }
        else if (o.at) { const h = (sc.def.hotspots || []).find((q) => q.id === o.at); if (h) { sx = h.x + h.w / 2 - cam; sy = h.y + h.h / 2; } }
        else if (this.game.lastTarget) { sx = this.game.lastTarget[0] - cam; sy = this.game.lastTarget[1]; }
      }
      this.game.renderFrame(true);
      await this.game.push(new UI.Zoom(this.game, Object.assign({}, o, { sx: U.clamp(sx, 26, P.W - 26), sy: U.clamp(sy, 18, P.H - 18) }))).promise;
    }
    async card(o) { await this.game.push(new UI.TitleCard(this.game, o)).promise; }
    async message(title, body, o) { await this.game.push(new UI.Message(this.game, title, body, o)).promise; }
    toast(t, icon, col) { this.game.toast(t, icon, col); }
    async goto(sceneId, o = {}) { await this.game.gotoScene(sceneId, o); }
    async revelation(id) { return P.Revelation.run(this, id); }
    async memoryTest(o) { return P.Flashback.memoryTest(this, o); }
    async flashback(on) { this.game.flashbackFx = on; }
    async phoneHenry() { return this.game.henryCall(this); }
    async complete(o) { return this.game.completeChapter(o || {}); }
    async map() { return this.game.openMap(); }
    skepticism(d) { this.s.skepticism = U.clamp((this.s.skepticism || 0) + d, 0, 3); return this.s.skepticism; }

    /* Shawn's signature move: introducing Gus by a ridiculous name. Returns the name used. */
    async introGus(npc) {
      const used = this.s.nicknamesUsed || (this.s.nicknamesUsed = []);
      const pool = P.world.nicknames.filter((n) => !used.includes(n));
      const nick = U.pick(pool.length ? pool : P.world.nicknames);
      used.push(nick);
      this.global.nicknames = (this.global.nicknames || 0) + 1;
      await this.say('shawn:smug', `I'm Shawn Spencer, psychic. And this is my associate, {y}${nick}{/}.`);
      const reacts = ["That is not my name.", "Burton Guster. Please. Just... Guster.", '*sigh* Hi.', "He's been doing this for twenty years.", 'You know that is not my name, Shawn.'];
      await this.say('gus:angry', U.pick(reacts));
      return nick;
    }
  }
  P.Script = Script;
})(window.P);

</script>
<script>/* src/engine/revelation.js */
'use strict';
/* Psychic Revelations.
   A revelation is a sequence of steps. For each step the player presents the clue that proves it.
   Correct -> Shawn gyrates through slightly-wrong "garbled" guesses from the spirit world, then nails it.
   Wrong   -> the vision fizzles and Lassiter's skepticism rises. Three strikes and you're out (for now). */
(function (P) {
  const G = P.G, U = P.U, UI = P.UI;
  const F = () => P.font;

  const MOVES = ['reel', 'crouchVision', 'tiptoe', 'stagger', 'kneel', 'wave', 'conduct', 'horse', 'hipsSway', 'flail', 'jazz', 'spin', 'lunge', 'frontArmsUp', 'frontTemples', 'frontStar', 'frontSquat', 'temple2', 'hop'];
  const ALT = {
    wave: (t) => (Math.floor(t * 5) % 2 ? P.Poses.wave1() : P.Poses.wave2()),
    conduct: (t) => (Math.floor(t * 4) % 2 ? P.Poses.conduct1() : P.Poses.conduct2()),
  };
  const WRONG_GARBLE = [
    'I SEE... A LLAMA IN A TRENCH COAT!', 'THE SPIRITS SAY... "NEW PHONE, WHO DIS?"', 'I\'M GETTING... A STRONG SENSE OF... NACHOS?',
    'THERE IS A... DOLPHIN! NO! A DOLPH LUNDGREN!', 'THE NUMBER... SEVEN! OR... FOURTEEN! OR A BEE!', 'I SEE A... OH. THAT\'S MY REFLECTION.',
    'THE SPIRITS ARE... SINGING... HALL AND OATES?', 'A MAN... NAMED... DAVE! WAIT. NO DAVES.',
  ];
  const SHAWN_RECOVER = [
    "Hold on, that was a pocket dial from the spirit world.", "The spirits are saying... nope, that's my stomach.", "Okay, that one came in on the wrong frequency. Spirit AM radio.",
    "My third eye has something in it. An eyelash, I think.", "False alarm. That was a ghost doing an impression of a clue.",
  ];
  const SKEPTIC_LINES = [
    ['lassiter:stern', 'Unbelievable. Chief, he is literally making this up.'], ['lassiter:smug', 'Spirits seem a little foggy today, Spencer.'], ['lassiter:angry', "That's strike number {n}, Spencer. I'm counting."],
    ['lassiter:stern', 'Is this the part where you fall down? I like the part where you fall down.'],
  ];

  const R = P.Revelation = {
    async run(g, id) {
      const game = g.game, ch = g.chapter, rev = ch.revelations[id];
      if (!rev) { console.warn('no revelation', id); return false; }
      if (rev.requires && !g.hasAll(rev.requires)) {
        await g.say('shawn:worried', "I'm getting... static. The spirits need more before they'll talk.");
        return false;
      }
      const st0 = { id, t: 0, aura: 0, banner: null, guess: null, big: null, skeptic: g.s.skepticism || 0, audience: rev.audience || [] };
      game.rev = st0;
      const prevMusic = P.audio.current;
      if (rev.intro) await rev.intro(g);
      P.audio.music(rev.music || 'vision');
      g.sfx('psychic');
      st0.aura = 1;
      g.anim('shawn', 'temple');
      g.flash('#c8a0ff', 300);
      await g.wait(600);
      const cleanup = () => { st0.aura = 0; game.rev = null; g.stopAnim('shawn'); if (g.actor('gus')) g.stopAnim('gus'); P.audio.music(U.call(game.scene.def.music, g) || prevMusic); };
      for (let i = 0; i < rev.steps.length; i++) {
        const step = rev.steps[i];
        for (;;) {
          st0.banner = { text: step.prompt, n: i + 1, total: rev.steps.length, t: 0 };
          if (step.lead) await g.say(step.leadWho || 'shawn:psychic', step.lead);
          const pick = await g.pick(step.kinds || ['clues', 'items'], step.short || 'Which clue proves it?');
          if (!pick) {
            st0.banner = null;
            await g.say('shawn:worried', "Hold on. The spirits put me on hold. I'm getting smooth jazz.");
            await g.say('gus', "He'll... he'll call them back.");
            cleanup();
            return false;
          }
          if (U.toArr(step.answer).includes(pick)) { await R.correct(g, st0, step, i); break; }
          const sk = await R.wrong(g, st0, step, pick);
          if (sk >= 3) {
            st0.banner = null;
            if (rev.fail) await rev.fail(g);
            else {
              await g.say('vick:stern', "That's enough, Mr. Spencer. Come back when the spirits have their facts straight.");
              await g.say('shawn:worried', "They're very disorganized. It's a union thing.");
            }
            g.s.skepticism = 0;
            cleanup();
            return false;
          }
        }
      }
      st0.banner = null;
      g.s.revDone[id] = true;
      g.s.skepticism = 0;
      if (rev.outro) await rev.outro(g);
      cleanup();
      game.autosave();
      return true;
    },

    async correct(g, st0, step, idx) {
      g.sfx('correct');
      st0.banner = Object.assign({}, st0.banner, { solved: true });
      const guesses = step.guesses || [];
      const moves = step.moves || U.shuffle(MOVES);
      const sh = g.actor('shawn');
      const baseX = sh.x;
      for (let k = 0; k < guesses.length; k++) {
        const mv = moves[k % moves.length];
        await R.move(g, mv, sh, baseX + (k % 2 ? -10 : 10) * (step.roam === false ? 0 : 1));
        st0.guess = { text: guesses[k], t: 0, k };
        g.sfx('spirit');
        R.react(g, st0, k);
        if (g.actor('gus') && (step.gusJoins || (k === 1 && Math.random() < 0.5))) g.anim('gus', U.pick(['jazz', 'hipsSway', 'temple', 'wave']), 900);
        await g.wait(step.beat || 1050);
      }
      // the landing
      st0.guess = null;
      g.stopAnim('shawn');
      if (step.pointAt && g.actor(step.pointAt)) g.face('shawn', step.pointAt);
      g.anim('shawn', 'point');
      st0.big = { text: step.final, t: 0 };
      g.sfx('reveal'); g.flash('#ffffff', 250); g.shake(350, 3);
      if (g.actor('gus')) g.anim('gus', 'armsUp', 900);
      await g.wait(1600);
      st0.big = null;
      g.stopAnim('shawn');

    },

    async wrong(g, st0, step, pick) {
      g.s.wrongPresents = (g.s.wrongPresents || 0) + 1;
      const custom = step.wrong && step.wrong[pick];
      g.anim('shawn', 'flail', 900);
      st0.guess = { text: U.pick(WRONG_GARBLE), t: 0, bad: true };
      g.sfx('spirit');
      await g.wait(1000);
      st0.guess = null;
      g.sfx('wrong'); g.shake(250, 2);
      g.anim('shawn', 'shrug', 900);
      if (custom) await custom(g);
      else await g.say('shawn:worried', U.pick(SHAWN_RECOVER));

      st0.skeptic = sk;

    async move(g, mv, sh, toX) {

    react(g, st0, k) {
      const sc = g.scene; if (!sc) return;
      const ids = st0.audience.length ? st0.audience : Object.keys(sc.actors).filter((i) => i !== 'shawn');
      const who = ids[(k + Math.floor(Math.random() * ids.length)) % ids.length];
      const map = { lassiter: ['...', 'anger', '...'], juliet: ['?', 'heart', '!'], vick: ['...', '?', '!'], gus: ['sweat', '!', 'music'], mcnab: ['!', '?', 'music'], henry: ['...', 'anger'] };
      const opts = map[who] || ['!', '?', '...'];
      g.emote(who, U.pick(opts), 900);
    },

    /* aura is painted under the actors (hooked from Scene.draw) */
    drawAura(x, game, cam) {
      const st0 = game.rev; if (!st0 || !st0.aura) return;
      const sh = game.scene && game.scene.actors.shawn; if (!sh) return;

      for (let r = 90; r > 6; r -= 6) {
        const c = cols[(Math.floor(r / 6 + t * 10)) % cols.length];
        G.ellipse(x, cx, cy, r * 1.15, r * 0.75, c);
      }
      x.globalAlpha = 0.8;
      for (let i = 0; i < 12; i++) {
        const a = t * 1.5 + (i / 12) * Math.PI * 2;
        G.line(x, cx + Math.cos(a) * 30, cy + Math.sin(a) * 20, cx + Math.cos(a) * 80, cy + Math.sin(a) * 52, i % 2 ? '#fee761' : '#9be564');
      }
      x.restore();
    },

    drawOverlay(x, game) {
      const st0 = game.rev; if (!st0) return;
      st0.t += 1 / 60;
      const t = game.t;
      // vignette
      if (st0.aura) { x.save(); for (let i = 0; i < 14; i++) { x.globalAlpha = 0.07; G.frame(x, i * 2, i * 2, P.W - i * 4, P.H - i * 4, '#1a0a2a'); G.frame(x, i * 2 + 1, i * 2 + 1, P.W - i * 4 - 2, P.H - i * 4 - 2, '#1a0a2a'); } x.restore(); }
      // skeptic-o-meter
      if (st0.aura && !game.ui.some((w) => w instanceof UI.Dialogue && w.pos === 'top')) {
        UI.panel(x, P.W - 98, 3, 95, 14, { accent: '#e43b44' });
        F().draw(x, 'LASSIE-METER', P.W - 94, 7, '#ffb0b0');
        for (let i = 0; i < 3; i++) G.rect(x, P.W - 25 + i * 7, 6, 5, 8, i < (game.state.skepticism || 0) ? '#e43b44' : '#3a2e70');
      }
      // banner (prompt) — shown when not covered by a top dialogue
      const topDlg = game.ui.some((w) => (w instanceof UI.Dialogue) && w.pos === 'top');
      if (st0.banner && !topDlg && !game.ui.some((w) => w instanceof UI.CaseFile)) {
        const b = st0.banner;
        const lines = F().wrap(b.text, 204);
        const h = 16 + lines.length * 10;
        UI.panel(x, 4, 3, 214, h, { fill: ['#3a1a5a', '#321650', '#2a1246', '#22103c'], accent: '#fee761' });
        F().draw(x, `VISION ${b.n}/${b.total}` + (b.solved ? '  ★' : ''), 10, 7, '#fee761');
        lines.forEach((l, i) => F().draw(x, l, 10, 17 + i * 10, '#ffffff', { shadow: '#0e0a14' }));
      }
      if (st0.guess) {
        st0.guess.t += 1 / 60;
        const gt = st0.guess.t;
        const s = Math.min(1, gt / 0.18);
        const col = st0.guess.bad ? '#ff8a8a' : ['#fee761', '#9be564', '#7ae2f8', '#ff8ab8'][st0.guess.k % 4];
        const lines = F().wrap(st0.guess.text, 150);
        lines.forEach((l, i) => F().draw(x, l, 160, 58 + i * 18 - (1 - s) * 10, col, { align: 'center', scale: 2, outline: '#1a0a2a', wave: t }));
      }
      if (st0.big) {

        x.restore();
        const lines = F().wrap(st0.big.text, 100);

      }
    },
  };
})(window.P);
